name: Compilar APK en la Nube

on:
  workflow_dispatch: # Botón manual en la pestaña Actions de GitHub

jobs:
  build-apk:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          cache: true

      - name: Instalar dependencias de Flutter
        run: flutter pub get

      - name: Compilar APK (Debug / Sin requerir firmas)
        run: flutter build apk --debug

      - name: Subir APK como archivo descargable
        uses: actions/upload-artifact@v4
        with:
          name: BuanaVPad-Debug-APK
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
