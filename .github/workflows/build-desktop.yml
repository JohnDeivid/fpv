name: Compilar Servidor PC Windows (.exe)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Compilar BuanaVPad PC FPV (.exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # uv = pip pero 10-100x mas rapido, con cache automatico
      - name: Instalar uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "desktop/requirements.txt"

      # vgamepad no tiene wheel en PyPI, hay que compilarlo.
      # Lo cacheamos para que solo se compile UNA VEZ en toda la vida del repo.
      - name: Cache del wheel compilado de vgamepad
        id: vgamepad-cache
        uses: actions/cache@v4
        with:
          path: desktop/wheels/
          key: vgamepad-wheel-win-py310-0.1.0-final

      - name: Compilar vgamepad como wheel (solo la primera vez)
        if: steps.vgamepad-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install wheel
          python -m pip wheel vgamepad==0.1.0 --wheel-dir wheels/

      - name: Instalar todas las dependencias con uv
        run: |
          uv pip install --system --find-links wheels/ -r requirements.txt
          uv pip install --system pyinstaller

      - name: Empaquetar con PyInstaller (.exe portable)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "BuanaVPad-FPV" main.py

      - name: Comprimir distribucion
        run: |
          Compress-Archive -Path dist\BuanaVPad-FPV\* -DestinationPath dist\BuanaVPad-FPV-Windows.zip

      - name: Subir .exe compilado
        uses: actions/upload-artifact@v4
        with:
          name: BuanaVPad-PC-FPV-Windows
          path: desktop/dist/BuanaVPad-FPV-Windows.zip
          retention-days: 30
